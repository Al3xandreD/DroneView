model:
  path2ijepa: "models.nosync/ijepa_checkpoints/ijepa-epoch=37-val_loss=0.0000.ckpt"

data:
  train:
    image_path: "data.nosync/Train/images"
    annotation_path: "data.nosync/Train/labelTxt-v1.5/DOTA-v1.5_train"
  val:
    image_path: "data.nosync/Val/images"
    annotation_path: "data.nosync/Val/labelTxt-v1.5/DOTA-v1.5_val"
  test:
    image_path:  "data.nosync/Test/images"
    annotation_path: "data.nosync/Test/test_info.json"
  new_image_size: [224, 224]
  num_patches: 14

training:
  epochs: 50
  batch_size: 32
  lr: 0.0001
  num_workers: 2
  # cpu, not mps: torchvision's roi_align has a pathological MPS kernel (backward
  # measured ~10x slower than CPU on an M1 Pro) and the heads are small, so the
  # cached-feature training path runs ~10x faster on the CPU. Feature extraction
  # (scripts/cache_features.py) still uses the GPU, where the ViT dominates.
  accelerator: cpu